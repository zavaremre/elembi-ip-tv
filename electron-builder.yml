# Packaging. The product's name lives in package.json and is read from there, so
# renaming the app is one line rather than a search across this file.
appId: com.zavaremre.elembi
copyright: Copyright © 2026 Emre Zavar

directories:
  output: dist
  buildResources: build

# electron-vite writes the three bundles into out/; nothing else ships.
files:
  - out/**
  - package.json

asar: true

# No version in the name, so a README can link to releases/latest/download/<file>
# and keep working after every release. ${name} is the ascii package name, which
# keeps the URL free of characters a browser would percent-encode.
artifactName: ${name}-${os}-${arch}.${ext}

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.entertainment
  # Ad-hoc signed, not unsigned. There is no Developer ID certificate, but
  # skipping signing altogether leaves Electron's own linker signature on a
  # bundle whose Info.plist and resources have since been replaced — macOS
  # reads that as tampering and refuses with "is damaged", which no amount of
  # right-click-Open gets past. "-" is codesign's ad-hoc identity: the bundle
  # verifies, and the user meets the ordinary unidentified-developer prompt.
  identity: "-"
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: AudioVideo
  # ffmpeg is required at runtime and deliberately not bundled: the app uses the
  # system one, and a distribution's own build is the one its codecs match.
  desktop:
    entry:
      StartupWMClass: elembi

publish:
  provider: github
  owner: zavaremre
  repo: elembi-ip-tv
  # Published, not drafted. A draft is not what /releases/latest points at, so
  # the README's download links would answer 404 until someone pressed publish.
  releaseType: release
