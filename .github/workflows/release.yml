name: Release

# Builds on a tag, because that is the thing a download link points at.
on:
  push:
    tags: ['v*']
  # Lets a build be tried without cutting a release.
  workflow_dispatch:

jobs:
  build:
    # Each platform is packaged on its own runner. Cross-building from one
    # machine needs wine for Windows and Docker for Linux; building natively
    # needs neither, and the result is the one the platform actually produces.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # macOS compiles its own ffmpeg, which is a minute of work repeated on
      # every tag for a result that only changes when the script does. The key
      # covers both scripts, and the pinned version lives inside them.
      - name: Cache ffmpeg
        uses: actions/cache@v4
        with:
          path: resources/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/prepare-ffmpeg.mjs', 'scripts/build-ffmpeg-macos.sh') }}

      # Puts ffmpeg and ffprobe under resources/ffmpeg, which electron-builder
      # copies into the app. A no-op on Linux, which takes the distribution's.
      - run: npm run ffmpeg

      # electron-builder packages out/, which only exists after this runs. A
      # local build had it lying around from development; a clean checkout does
      # not, and the asar came out without an entry point.
      - run: npm run build

      # --publish always creates or updates the release for this tag and
      # attaches the artifacts. GITHUB_TOKEN is issued to every run, so no
      # secret has to be configured for this to work.
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
