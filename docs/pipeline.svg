<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0c12"/><stop offset="1" stop-color="#05050a"/></linearGradient>
      <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#00d8ff"/></marker></defs>
<rect x="0" y="0" width="1200" height="470" rx="0" fill="url(#bg)"/>
<ellipse cx="600" cy="150" rx="520" ry="200" fill="#00d8ff" opacity="0.055"/>
<text x="30" y="56" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" fill="#f7f8fb" font-weight="800" text-anchor="start" letter-spacing="-1">One clock</text>
<text x="30" y="84" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#a8aebe" font-weight="500" text-anchor="start">Video, audio and subtitles leave the same ffmpeg session, on the same timeline.</text>
<rect x="30" y="122" width="258" height="158" rx="16" fill="rgba(21,23,31,0.72)" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
<rect x="30" y="122" width="258" height="3" rx="2" fill="#6e7486"/>
<text x="48" y="154" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#f7f8fb" font-weight="800" text-anchor="start">Provider</text>
<text x="48" y="180" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="12" fill="#a8aebe" font-weight="500" text-anchor="start">Xtream Codes API</text>
<text x="48" y="201" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="12" fill="#a8aebe" font-weight="500" text-anchor="start">MKV / MP4 stream</text>
<text x="48" y="222" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="12" fill="#a8aebe" font-weight="500" text-anchor="start">one connection</text>
<line x1="294" y1="201" x2="308" y2="201" stroke="#00d8ff" stroke-width="2" marker-end="url(#ar)"/>
<rect x="314" y="122" width="258" height="158" rx="16" fill="rgba(21,23,31,0.72)" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
<rect x="314" y="122" width="258" height="3" rx="2" fill="#00d8ff"/>
<text x="332" y="154" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#f7f8fb" font-weight="800" text-anchor="start">ffmpeg</text>
<text x="332" y="180" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="12" fill="#a8aebe" font-weight="500" text-anchor="start">-noaccurate_seek</text>
<text x="332" y="201" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="12" fill="#a8aebe" font-weight="500" text-anchor="start">video copied</text>
<text x="332" y="222" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="12" fill="#a8aebe" font-weight="500" text-anchor="start">audio to AAC</text>
<text x="332" y="243" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="12" fill="#a8aebe" font-weight="500" text-anchor="start">subtitles to WebVTT</text>
<line x1="578" y1="201" x2="592" y2="201" stroke="#00d8ff" stroke-width="2" marker-end="url(#ar)"/>
<rect x="598" y="122" width="258" height="158" rx="16" fill="rgba(21,23,31,0.72)" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
<rect x="598" y="122" width="258" height="3" rx="2" fill="#00d8ff"/>
<text x="616" y="154" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#f7f8fb" font-weight="800" text-anchor="start">127.0.0.1</text>
<text x="616" y="180" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="12" fill="#a8aebe" font-weight="500" text-anchor="start">HLS playlist</text>
<text x="616" y="201" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="12" fill="#a8aebe" font-weight="500" text-anchor="start">segments</text>
<text x="616" y="222" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="12" fill="#a8aebe" font-weight="500" text-anchor="start">subtitle group</text>
<line x1="862" y1="201" x2="876" y2="201" stroke="#00d8ff" stroke-width="2" marker-end="url(#ar)"/>
<rect x="882" y="122" width="258" height="158" rx="16" fill="rgba(21,23,31,0.72)" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
<rect x="882" y="122" width="258" height="3" rx="2" fill="#19e57a"/>
<text x="900" y="154" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#f7f8fb" font-weight="800" text-anchor="start">Player</text>
<text x="900" y="180" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="12" fill="#a8aebe" font-weight="500" text-anchor="start">hls.js + MSE</text>
<text x="900" y="201" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="12" fill="#a8aebe" font-weight="500" text-anchor="start">draws subtitles itself</text>
<text x="900" y="222" font-family="'IBM Plex Mono', 'SF Mono', Menlo, monospace" font-size="12" fill="#a8aebe" font-weight="500" text-anchor="start">seek by position</text>
<rect x="30" y="312" width="1140" height="1" rx="0" fill="rgba(255,255,255,0.08)"/>
<text x="30" y="348" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#f7f8fb" font-weight="800" text-anchor="start">Why this way</text>
<text x="30" y="376" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a8aebe" font-weight="500" text-anchor="start">Chromium cannot seek by position in MKV</text>
<text x="30" y="396" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6e7486" font-weight="500" text-anchor="start">and cannot decode AC-3 / E-AC-3 audio at all.</text>
<text x="412" y="376" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a8aebe" font-weight="500" text-anchor="start">As a separate file, each output restarts from</text>
<text x="412" y="396" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6e7486" font-weight="500" text-anchor="start">its own first packet, and the drift begins.</text>
<text x="794" y="376" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a8aebe" font-weight="500" text-anchor="start">Measured: video 1.442 · audio 1.462 · subs 1.173</text>
<text x="794" y="396" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6e7486" font-weight="500" text-anchor="start">All on one clock — no correction needed.</text>
<text x="30" y="440" font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6e7486" font-weight="500" text-anchor="start">The catalogue is written to disk, so the app opens full even when the provider cannot be reached.</text>
</svg>
